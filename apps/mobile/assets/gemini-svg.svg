    <line x1="90" y1="380" x2="250" y2="300" />
    <line x1="250" y1="300" x2="410" y2="380" />
    
    <!-- Outer Rings for Nodes -->
    <circle cx="90" cy="380" r="22" fill="#FFFFFF" stroke="#00C4CC" stroke-width="16" />
    <circle cx="250" cy="300" r="22" fill="#FFFFFF" stroke="#00C4CC" stroke-width="16" />
